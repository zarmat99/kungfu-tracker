<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kung Fu Tracker</title>
  <meta name="description" content="Il mio diario di allenamento di kung fu">
  <meta name="theme-color" content="#0b0a0d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kung Fu">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&text=功夫太极少林形意散打会赛记录日历拳空一二三四五六七八九十月备战回合奖牌进季周时标&display=block">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="#/calendar" aria-label="Kung Fu Tracker">
        <span class="seal"><span>功夫</span></span>
        <span class="brand-text"><b>Kung Fu</b><small>Tracker</small></span>
      </a>
      <div class="top-actions">
        <span class="streak" hidden></span>
        <span class="sync" data-status="idle" role="img"></span>
        <a class="icon-btn" href="#/settings" aria-label="Impostazioni" data-settings></a>
      </div>
    </header>
    <main id="main"></main>
  </div>
  <nav class="dock" aria-label="Sezioni">
    <a href="#/calendar" data-tab="calendar"></a>
    <a href="#/progress" data-tab="progress"></a>
    <a href="#/log" data-tab="log" class="dock-cta"></a>
    <a href="#/competitions" data-tab="competitions"></a>
  </nav>
</body>
</html>
